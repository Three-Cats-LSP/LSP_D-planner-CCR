name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Android Apk/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app version from index.html
        id: version
        run: |
          VERSION=$(grep -oP "APP_VERSION\s*=\s*'\K[^']+" index.html)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]:-0}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (code: $VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp capacitor-bridge.js www/capacitor-bridge.js
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp icon-192.png www/icon-192.png 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true

      - name: Capacitor sync (copies web assets + updates plugins)
        run: npx cap sync android

      - name: Patch build.gradle with extracted version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.VERSION_CODE }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.VERSION }}\"/" android/app/build.gradle
          echo "build.gradle after patch:"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify MainActivity is packaged in APK
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk classes*.dex | strings | grep -q 'dplannerccr/MainActivity' \
            || (echo 'FATAL: MainActivity missing from APK dex — launch will crash' && exit 1)
          echo 'MainActivity found in APK dex'

      - name: Place APK at output location
        run: |
          mkdir -p "Android Apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Android Apk/LSP_D-planner-CCR.apk"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest Android APK (archived)" \
              --notes "Frozen CCR edition. Download: https://threecats-lsp.com/d-planner-ccr/download.html" \
              --latest
          cp "Android Apk/LSP_D-planner-CCR.apk" /tmp/LSP_D-planner-CCR.apk
          gh release upload latest /tmp/LSP_D-planner-CCR.apk --clobber

      - name: Commit APK for direct download page
        run: |
          if git diff --quiet -- "Android Apk/LSP_D-planner-CCR.apk"; then
            echo "Committed APK already matches build output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Android Apk/LSP_D-planner-CCR.apk"
          git commit -m "Update Android APK [skip ci]"
          git push
